[project]
name = "ingestion"
version = "0.1.0"
description = "Maplestory data ingestion — extract + load with dlt."
requires-python = ">=3.13"
dependencies = [
    "dlt[postgres]>=1.28.2",
    "google-auth>=2.56.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "curl-cffi>=0.16.0",
    "dlt[hub]>=1.28.2",
    "ibis-framework>=12.0.0",
    "marimo>=0.23.14",
    "numpy>=2.5.1",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "s3fs>=2026.6.0",
    "selectolax>=0.4.11",
]
