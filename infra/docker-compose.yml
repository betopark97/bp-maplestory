name: bp-maplestory

services:
  postgres:
    image: postgres:18.4
    container_name: bp-maplestory-postgres
    restart: unless-stopped
    env_file:
      - .env # relative to the compose file, not the cwd
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # postgres:18+ places data in a versioned subdir; mount the parent.
      - pgdata:/var/lib/postgresql
      # Runs once, on an empty data directory only. See initdb/01-databases.sql.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: bp-maplestory-minio
    restart: unless-stopped
    env_file:
      - .env # relative to the compose file, not the cwd
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000" # S3 API endpoint
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console (browser UI)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
